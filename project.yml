# XcodeGen spec. CI runs `xcodegen generate` to create Pleats.xcodeproj (not checked in).
name: Pleats
options:
  bundleIdPrefix: com.heyobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Pleats:
    type: application
    platform: iOS
    sources:
      - Pleats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.pleats
        PRODUCT_NAME: Pleats
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Pleats/Info.plist
      properties:
        CFBundleDisplayName: Pleats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr, es, pt-BR, de]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchColor
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PleatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PleatsTests
    dependencies:
      - target: Pleats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.pleats.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pleats.app/Pleats
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Pleats:
    build:
      targets:
        Pleats: all
        PleatsTests: [test]
    test:
      targets:
        - PleatsTests
    archive:
      config: Release
